apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.frontend_host }}
    http:
      paths:
      # Backend MUST come first (more specific path)
      - path: /backend(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.inventory.serviceName }}
            port:
              name: {{ .Values.inventory.service.port_name }}
      # Frontend with capture group so $2 = full path
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.frontend.serviceName }}
            port:
              name: {{ .Values.frontend.service.port_name }}